<!doctype html>
<!--
  Gabarit du PDF de recette (skill recette-navigateur).
  - Copier ce fichier à côté du dossier d'images, remplacer les [[…]] et dupliquer les blocs.
  - Une figure = un résultat visible : titre, capture et légende restent sur la même page.
  - Les vérifications hors écran vont dans des tableaux, jamais en capture de terminal.
  - Impression : chromium --headless --no-pdf-header-footer --print-to-pdf=<sortie.pdf> <ce fichier>
-->
<html lang="fr">
<head>
<meta charset="utf-8">
<title>[[TITRE]]</title>
<style>
  @page { size: A4; margin: 14mm 14mm 16mm; }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: "DejaVu Sans", "Liberation Sans", Arial, sans-serif; font-size: 9.5pt; line-height: 1.45; color: #1f2937; }
  header.titre { border-bottom: 2px solid #1f2937; padding-bottom: 3mm; margin-bottom: 6mm; }
  h1 { font-size: 17pt; margin: 0 0 1.5mm; }
  .sous-titre { color: #6b7280; }
  h2 { font-size: 12.5pt; margin: 7mm 0 3mm; break-after: avoid; page-break-after: avoid; }
  section.parcours + section.parcours { break-before: page; page-break-before: always; }
  p, ul { margin: 0 0 3mm; }
  figure.resultat { margin: 0 0 6mm; break-inside: avoid; page-break-inside: avoid; }
  figure.resultat h3 { font-size: 10.5pt; margin: 0 0 1.5mm; }
  figure.resultat img { display: block; max-width: calc(100% - 2px); max-height: 165mm; border: 1px solid #d1d5db; }
  figcaption { margin-top: 1.5mm; font-size: 8.8pt; color: #374151; }
  .etiquette { display: inline-block; padding: 0 2mm; border-radius: 2mm; font-size: 8pt; font-weight: 700; vertical-align: 1px; }
  .ok { background: #dcfce7; color: #166534; }
  .ko { background: #fee2e2; color: #991b1b; }
  .non-joue { background: #e5e7eb; color: #374151; }
  table { width: calc(100% - 1px); border-collapse: collapse; font-size: 8.3pt; margin: 1mm 0 5mm; }
  thead { display: table-header-group; }
  tr { break-inside: avoid; page-break-inside: avoid; }
  th, td { border: 1px solid #d1d5db; padding: 1.1mm 1.7mm; text-align: left; vertical-align: top; }
  th { background: #f3f4f6; }
  .encadre { background: #f3f4f6; border-radius: 2mm; padding: 3mm 4mm; margin: 0 0 5mm; break-inside: avoid; }
</style>
</head>
<body>

<header class="titre">
  <h1>[[TITRE]]</h1>
  <div class="sous-titre">[[SOUS_TITRE]] — [[DATE]]</div>
</header>

<section>
  <h2>Synthèse</h2>
  <div class="encadre">[[SYNTHESE]]</div>
  <table>
    <thead><tr><th>Scénario</th><th>Résultat</th><th>Capture</th><th>Remarque</th></tr></thead>
    <tbody>
      <tr><td>[[ID]] — [[TITRE_SCENARIO]]</td><td><span class="etiquette ok">OK</span></td><td>[[NN]]</td><td></td></tr>
    </tbody>
  </table>
</section>

<section class="parcours">
  <h2>[[PARCOURS]]</h2>

  <figure class="resultat">
    <h3>[[ID]] — [[TITRE_SCENARIO]] <span class="etiquette ok">OK</span></h3>
    <img src="images/[[NN]]-[[ID]]-[[OBJET]].jpg" alt="">
    <figcaption><b>Étant donné</b> [[ETANT_DONNE]] · <b>Quand je</b> [[QUAND_JE]] · <b>Alors</b> [[ALORS]]</figcaption>
  </figure>

  <table>
    <thead><tr><th>Vérification hors écran</th><th>Attendu</th><th>Constaté</th></tr></thead>
    <tbody>
      <tr><td>[[VERIFICATION]]</td><td>[[ATTENDU]]</td><td>[[CONSTATE]]</td></tr>
    </tbody>
  </table>
</section>

</body>
</html>
